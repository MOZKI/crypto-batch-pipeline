version: 2

models:
  - name: silver_coin_market_cleaned
    description: "Data coin market yang sudah dibersihkan, dedup, dan di-cast tipenya"
    columns:
      - name: unique_key
        description: "Kombinasi coin_id + ingestion_date, harus unik per baris"
        tests:
          - unique
          - not_null
      - name: coin_id
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
      - name: ingestion_date
        tests:
          - not_null
